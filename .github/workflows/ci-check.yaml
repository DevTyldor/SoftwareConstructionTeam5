
# This workflow will run on pull requests to the dev branch and can also be triggered manually.
# This workflow will run a series of tests on the codebase to ensure that it is functioning correctly.

name: CI
on:
  pull_request:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      run-tests:
        description: 'Run tests'
        required: false
        default: test/integration

#Check if there is a new commit on the dev branch and run the tests on it.
#This also cancels olders job, so the tests are only run on the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

#Setup environment variables for the workflow, including 
#the API key 
#and Python version.
env:
  API_KEY: ${{ secrets.API_KEY }}
  PYTHON_VERSION: "3.14"

#Checkout code and run integration tests
jobs:
  integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
#Setup environment variables for the integration tests, including the API key and base URL for the API.
    env:
      API_BASE_URL: "http://localhost:3000/api/v1"
      TESTDATA_DIR: ${{ github.workspace }}/data

#Run the full test suite to ensure that the codebase is functioning correctly.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

#1. Checkout testdata in private repo
#   Move data to correct folder
      - name: Checkout testdata (private repo)
        uses: actions/checkout@v4
        with:
          repository: nsamijo/data
          token: ${{ secrets.TEST_DATA_REPO_TOKEN }}
          path: private-testdata
      - name: Move loaded testdata into data folder
        run: |
          mkdir -p data
          cp private-testdata/data/*.json data/
          echo "Test data loaded in succesfully"
#2. Setup Python environment with correct version.
      - name: Set up Python ${{env.PYTHON_VERSION}}
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}
          cache: "pip"
#3. Install dependencies from requirements.txt file.
      - name: Install dependancies
        uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_VERSION}}
      - run: pip install -r requirements.txt
#4. Start the API server in the background and check every second for 5 seconds
#   if the server has started successfully by curling API.
      - name: Start API server
        run: |
          nohup python api/main.py > server.log 2>&1 &
          for seconds in {1..15}; do

          STATUS=$(curl -s -o response.txt -w "%{http_code}" -H "API_KEY: $API_KEY" ${{env.API_BASE_URL}}/clients/1 || true)

          if [ "$STATUS" = 200 ]; then
            echo "Data loaded in succesfull"
            echo "Server is up"
            exit 0
          fi
            sleep 1
            echo "Attempt $seconds: HTTP $STATUS"
          done
          echo "Server failed to start. Check server.log for details."
          cat server.log
          exit 1
#5. Run the integration tests using pytest and generate a JUnit XML report for the test results.
      - name : Run integration tests
        env:
          TEST_PATH: ${{ inputs.test_path || 'tests/integration' }}
        run: pytest "$TEST_PATH" -v -rA --junitxml=integration-testresults.xml --disable-warnings | tee pytest-output.txt
#6. Filter results and add to respective passed and fail files
#   Passed: passed-tests.md
#   Failed: failed-tests.md
      - name: Filter and build test results
        if: always()
        run: |
          touch pytest-output.txt
          PASSED=(grep -cE '^PASSED' pytest-output.txt; true)
          FAILED=(grep -cE '^(FAILED|ERROR)' pytest-output.txt; true)
          {
            echo "### Failed tests"
            echo '---\tStart\t---'
            if [ -n "$FAILED" ]:then
              printf '%s\n "$FAILED"'
            else
              echo "No failed tests."
            fi
            echo '---\tEND\t---'
          } > failed-tests.md
          {
            echo "### Passed tests "
            echo '---\tStart\t---'
            if [ -n "$PASSED" ]:then
              printf '%s\n "$PASSED"'
            else
              echo "No passed tests."
            fi
            echo '---\tEND\t---'
          } > passed-tests.md
#7. Add the test results as comments
      - name: Comment PASSED results on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: passed-tests.md
          comment-tag: passed-tests
      
      - name: Comment FAILED results on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: failed-tests.md
          comment-tag: failed-tests
#8. Upload the JUnit XML report to GitHub Actions for easy viewing of test results.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: |
            integration-testresults.xml
            passed-tests.md
            failed-tests.md
#Failed run: Show server log on failure
      - name: Show server log on failure
        if: failure()
        run: cat server.log
