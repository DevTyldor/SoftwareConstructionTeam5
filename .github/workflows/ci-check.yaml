
# This workflow will run on pull requests to the dev branch and can also be triggered manually.
# This workflow will run a series of tests on the codebase to ensure that it is functioning correctly.

name: CI
on:
  pull_request:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      run-tests:
        description: 'Run tests'
        required: false
        default: test/integration

#Check if there is a new commit on the dev branch and run the tests on it.
#This also cancels olders job, so the tests are only run on the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

#Setup environment variables for the workflow, including 
#the API key 
#and Python version.
env:
  API_KEY: ${{ secrets.API_KEY }}
  PYTHON_VERSION: "3.14"

#Checkout code and run integration tests
jobs:
  integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
#Setup environment variables for the integration tests, including the API key and base URL for the API.
    env:
      API_KEY: ${{ secrets.API_KEY }}
      API_BASE_URL: "http://localhost:3000"
      PYTHON_VERSION: "3.14"
      TESTDATA_DIR: ${{ github.workspace }}/data

#Run the full test suite to ensure that the codebase is functioning correctly.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

#1. Checkout testdata in private repo
#   Move data to correct folder
      - name: Checkout testdata (private repo)
        uses: actions/checkout@v4
        with:
          repository: nsamijo/data
          token: ${{ secrets.TEST_DATA_REPO_TOKEN }}
          path: private-testdata
      - name: Move loaded testdata into data folder
        run: |
          mkdir -p data
          cp private-testdata/data/*.json data/
          echo "Test data loaded in succesfully"
#2. Setup Python environment with correct version.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
#3. Install dependencies from requirements.txt file.
      - name: Install dependancies
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
#4. Start the API server in the background and check every second for 5 seconds
#   if the server has started successfully by checking the server log for any errors.
      - name: Start API server
        run: |
          nohup python api/main.py > server.log 2>&1 &
          for seconds in {1..15}; do
            if curl -sf -o /dev/null -H "API_KEY:${{secrets.API_KEY }}" http:localhost:3000/api/v1/clients/1; then
              echo "Data loaded in succesfull"
              echo "Server is up"
              exit 0
            fi
            sleep 1
            curl -sf -o /dev/null -H "API_KEY:${{secrets.API_KEY }}" http:localhost:3000/api/v1/clients/1 >> echo
          done
          echo "Server failed to start. Check server.log for details."
          echo "--- data folder ---"
          ls -la data || echo "data folder not found"
          cat server.log
          exit 1
#5. Run the integration tests using pytest and generate a JUnit XML report for the test results.
      - name : Run integration tests
        env:
          TEST_PATH: ${{ inputs.test_path || 'tests/integration' }}
        run: pytest -q "$TEST_PATH" -v -rA --junitxml=integration_test_results.xml --disable-warnings
#7 Upload the JUnit XML report to GitHub Actions for easy viewing of test results.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: integration_test_results.xml
#8. Show server log on failure
      - name: Show server log on failure
        if: failure()
        run: cat server.log
