#Workflow to do a ruff check on the codebase to identify any issues
#If bugs get found, stop execution of testing and report the issues to the user. 
#This is a quick check to identify any issues with the codebase before running the full test suite.
#Tiggers on
# pull requests to the dev branch
name: Ruff(Rough) Check
on:
  pull_request:
    branches: [ "dev" ]

#Check if there is a new commit on the dev branch and run the tests on it.
#This also cancels olders job, so the tests are only run on the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true 

#Set permissions
# Read: Allows the workflow to read the contents of the repository, including code, issues, and pull requests.
# Write: Allows the workflow to recomment fixes to pull requests.
permissions:
  contents: read
  pull-requests: write

#Ruff job: check codebase to be merged into dev branch for any issues.
#Report issues as comments to pull request.
jobs:
  ruff-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
#Makes it always report green so this workflow is treated as advisory
#So merged are not blocked
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

#Set up Python environment for the ruff check, including the specified Python version and caching pip dependencies.
      - name: Set up Python "3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

#Install ruff-package (to check codebase)
      - name: Install ruff
        run: pip install ruff

#Run ruff check
#Make the reports become inline annotations in the pull request
#Format warnings to become yellow warnings instead of red
#Emits errors
      - name: Run ruff check (inline warnings and pull request comment)
        run: ruff check . --output-format=github | sed 's/^::error/::warning/' || true
      
#Check if file is created and if checks are passed first

      - name: Build ruff report
        run: |
          ruff check . --output-format=concise > ruff-report.txt || true
          if [ ! -s ruff-raw.txt ]; then
            #check if file exists or is empty
            echo "### All ruff checks passed; No recommendations." > ruff-comment.md
          elif grep -q "All checks passed" ruff-raw.txt; then
            #check ruff report for all checks passed
            echo "### All ruff checks passed; No recommendations." > ruff-comment.md
          else
            {
              echo "### Ruff recommendation"
              echo "---/t---"
              cat ruff-raw.txt
            } > ruff-comment.md
          fi

      - name: Comment ruff on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: ruff-comment.md
          comment-tag: ruff-report